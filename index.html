<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт стоимости ангара</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 550px; width: 100%; padding: 25px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .checkbox-group input { width: auto; }
        .result { margin-top: 20px; padding: 15px; background-color: #eef7ee; border: 1px solid #c3e6cb; border-radius: 6px; color: #155724; font-size: 18px; text-align: center; font-weight: bold; line-height: 1.5; }
        .error-screen { text-align: center; padding: 40px 20px; color: #721c24; background-color: #f8d7da; border-radius: 12px; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div id="app" class="card">
    <div id="loading" style="text-align: center; font-weight: bold; padding: 20px; color: #007bff;">
        Проверка одноразовой ссылки...
    </div>

    <div id="calculator" style="display: none;">
        <h2>📐 Калькулятор стоимости ангара</h2>
        <p id="welcome-client" style="text-align: center; color: #007bff; font-weight: bold;"></p>
        
        <div class="form-group">
            <label for="shape">Тип конструкции:</label>
            <select id="shape" onchange="calculate()">
                <option value="1.0">Арочный ангар</option>
                <option value="1.2">Прямостенный ангар (+20%)</option>
                <option value="1.15">Шатровый ангар (+15%)</option>
                <option value="1.25">Полигональный ангар (+25%)</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label for="width">Ширина (м):</label>
                <input type="number" id="width" value="12" min="1" oninput="calculate()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="length">Длина (м):</label>
                <input type="number" id="length" value="30" min="1" oninput="calculate()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="height">Высота (м):</label>
                <input type="number" id="height" value="6" min="1" oninput="calculate()">
            </div>
        </div>

        <div class="form-group">
            <label for="type">Тип обшивки и утепления:</label>
            <select id="type" onchange="calculate()">
                <option value="15000">Холодный (Профлист) — 15 000 ₸/м²</option>
                <option value="22000">Утеплённый (Профлист + Минвата) — 22 000 ₸/м²</option>
                <option value="30000">Тёплый (Сэндвич-панели 100мм) — 30 000 ₸/м²</option>
                <option value="38000">Тёплый (Сэндвич-панели 150мм) — 38 000 ₸/м²</option>
            </select>
        </div>

        <div class="form-group">
            <label>Дополнительно:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="foundation" onchange="calculate()">
                <label for="foundation">Заливка фундамента (+5 000 ₸/м²)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="gates" checked onchange="calculate()">
                <label for="gates">Ворота распашные (250 000 ₸)</label>
            </div>
        </div>

        <div class="result" id="total-price">Загрузка расчёта...</div>
    </div>

    <div id="error-box" class="error-screen" style="display: none;">
        <h2>Доступ ограничен</h2>
        <p id="error-text">Эта персональная ссылка уже была использована ранее или не существует.</p>
    </div>
</div>

<script>
    var BIN_ID = "6ac4cb26ffd5d16053522bbd";
    var SECRET_KEY = "$2a$10$9Exa4U6mhnBLUonlmGU9k.F34LVjzJAC.TOInxH6vJHAt6JF1HBry";

    function calculate() {
        var shapeCoeff = parseFloat(document.getElementById('shape').value) || 1.0;
        var width = parseFloat(document.getElementById('width').value) || 0;
        var length = parseFloat(document.getElementById('length').value) || 0;
        var basePricePerMeter = parseFloat(document.getElementById('type').value) || 0;

        var area = width * length;
        var pricePerMeter = basePricePerMeter * shapeCoeff;
        if (document.getElementById('foundation').checked) pricePerMeter += 5000;

        var total = area * pricePerMeter;
        if (document.getElementById('gates').checked) total += 250000;

        document.getElementById('total-price').innerHTML = 
            'Площадь: <b>' + area + ' м²</b><br>' +
            'Ориентировочная стоимость: <b>' + Math.round(total).toLocaleString('ru-RU') + ' ₸</b>';
    }

    function showError(msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('calculator').style.display = 'none';
        document.getElementById('error-box').style.display = 'block';
        if (msg) {
            document.getElementById('error-text').innerText = msg;
        }
    }

    function verifyAndBurnToken() {
        var urlParams = new URLSearchParams(window.location.search);
        var linkId = urlParams.get('id');
        var client = urlParams.get('client');

        if (!linkId) {
            showError("Отсутствует идентификатор ссылки.");
            return;
        }

        var xhrGet = new XMLHttpRequest();
        xhrGet.open("GET", "https://api.jsonbin.io/v3/b/" + BIN_ID + "/latest", true);
        xhrGet.setRequestHeader("X-Master-Key", SECRET_KEY);
        
        xhrGet.onload = function() {
            if (xhrGet.status !== 200) {
                showError("Ошибка доступа к базе данных (Код: " + xhrGet.status + ")");
                return;
            }

            try {
                var response = JSON.parse(xhrGet.responseText);
                var db = response.record || {};

                if (!db[linkId] || db[linkId].used === true) {
                    showError("Эта ссылка уже сгорела или не существует.");
                    return;
                }

                // Помечаем ссылку как использованную
                db[linkId].used = true;

                var xhrPut = new XMLHttpRequest();
                xhrPut.open("PUT", "https://api.jsonbin.io/v3/b/" + BIN_ID, true);
                xhrPut.setRequestHeader("Content-Type", "application/json");
                xhrPut.setRequestHeader("X-Master-Key", SECRET_KEY);

                xhrPut.onload = function() {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('calculator').style.display = 'block';
                    if (client) {
                        document.getElementById('welcome-client').innerText = "Расчёт для: " + decodeURIComponent(client);
                    }
                    calculate();
                };

                xhrPut.onerror = function() {
                    showError("Ошибка обновления статуса ссылки.");
                };

                xhrPut.send(JSON.stringify(db));

            } catch(e) {
                showError("Ошибка обработки данных.");
            }
        };

        xhrGet.onerror = function() {
            showError("Не удалось связаться с сервером.");
        };

        xhrGet.send();
    }

    verifyAndBurnToken();
</script>

</body>
</html>
