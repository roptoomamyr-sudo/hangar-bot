<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт стоимости ангара</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 25px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef7ee;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            color: #155724;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }
        .error-screen {
            text-align: center;
            padding: 40px 20px;
            color: #721c24;
            background-color: #f8d7da;
            border-radius: 12px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div id="app" class="card">
    <div id="calculator">
        <h2>📐 Калькулятор стоимости ангара</h2>
        <p id="welcome-client" style="text-align: center; color: #007bff; font-weight: bold;"></p>
        
        <div class="form-group">
            <label for="width">Ширина (м):</label>
            <input type="number" id="width" value="12" oninput="calculate()">
        </div>

        <div class="form-group">
            <label for="length">Длина (м):</label>
            <input type="number" id="length" value="30" oninput="calculate()">
        </div>

        <div class="form-group">
            <label for="type">Тип ангара:</label>
            <select id="type" onchange="calculate()">
                <option value="15000">Холодный (арочный) — 15 000 ₸/м²</option>
                <option value="25000">Утеплённый (сэндвич) — 25 000 ₸/м²</option>
            </select>
        </div>

        <div class="result" id="total-price">
            Итоговая стоимость: 5 400 000 ₸
        </div>
    </div>

    <div id="error-box" class="error-screen" style="display: none;">
        <h2 id="error-title">Ошибка доступа</h2>
        <p id="error-message">Эта ссылка уже была использована ранее.</p>
    </div>
</div>

<script>
    const RENDER_SERVER = "https://hangar-bot-jxwb.onrender.com"; 

    function calculate() {
        const width = parseFloat(document.getElementById('width').value) || 0;
        const length = parseFloat(document.getElementById('length').value) || 0;
        const pricePerMeter = parseFloat(document.getElementById('type').value) || 0;

        const area = width * length;
        const total = area * pricePerMeter;

        document.getElementById('total-price').innerText = Площадь: ${area} м²\nИтого: ${total.toLocaleString('ru-RU')} ₸;
    }

    async function checkTokenAsync() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) return;

        try {
            const response = await fetch(${RENDER_SERVER}/api/check-token?token=${token});
            const data = await response.json();

            if (data.status === 'used' || data.status === 'invalid') {
                document.getElementById('calculator').style.display = 'none';
                document.getElementById('error-box').style.display = 'block';
            } else if (data.status === 'valid' && data.client) {
                document.getElementById('welcome-client').innerText = Расчёт для: ${data.client};
            }
        } catch (err) {
            console.log('Фоновая проверка выполняется...');
        }
    }

    // Калькулятор сходу открывается и считает
    calculate();

    // Проверка ссылки параллельно в фоновом режиме
    checkTokenAsync();
</script>

</body>
</html>
