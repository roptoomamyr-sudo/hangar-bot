<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт стоимости ангара</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 650px; width: 100%; padding: 25px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .checkbox-group input { width: auto; }
        .result { margin-top: 20px; padding: 20px; background-color: #eef7ee; border: 1px solid #c3e6cb; border-radius: 8px; color: #155724; font-size: 18px; text-align: center; font-weight: bold; line-height: 1.6; }
        .error-screen { text-align: center; padding: 40px 20px; color: #721c24; background-color: #f8d7da; border-radius: 12px; border: 1px solid #f5c6cb; }
        .section-title { font-weight: bold; margin-top: 15px; margin-bottom: 10px; border-bottom: 2px solid #007bff; padding-bottom: 5px; color: #007bff; }
    </style>
</head>
<body>

<div id="app" class="card">
    <div id="loading" style="text-align: center; font-weight: bold; padding: 20px; color: #007bff;">
        Проверка одноразовой ссылки...
    </div>

    <div id="calculator" style="display: none;">
        <h2>📐 Расчёт стоимости ангара</h2>
        <p id="welcome-client" style="text-align: center; color: #007bff; font-weight: bold;"></p>
        
        <div class="section-title">1. Параметры здания</div>
        <div class="form-group">
            <label for="type">Тип конструкции и покрытия:</label>
            <select id="type" onchange="toggleWallHeight(); calculate();">
                <option value="arch_tent">Арочный (Тент ПВХ)</option>
                <option value="straight_tent">Прямостеный арочный (Тент ПВХ)</option>
                <option value="straight_prof">Прямостеный двускатный (Профлист)</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label for="width">Ширина (м):</label>
                <input type="number" id="width" value="12" min="10" max="30" oninput="calculate()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="length">Длина (м):</label>
                <input type="number" id="length" value="30" min="1" oninput="calculate()">
            </div>
            <div class="form-group" id="wall-height-box" style="flex: 1; display: none;">
                <label for="wallHeight">Высота стены (м):</label>
                <input type="number" id="wallHeight" value="3" min="3" max="10" oninput="calculate()">
            </div>
        </div>

        <div class="section-title">2. Ворота</div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 2;">
                <label for="gates">Размер распашных ворот:</label>
                <select id="gates" onchange="calculate()">
                    <option value="none">Без ворот</option>
                    <option value="3x3">Ворота 3 × 3 м</option>
                    <option value="4x4" selected>Ворота 4 × 4 м</option>
                    <option value="5x5">Ворота 5 × 5 м</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="gateCount">Количество (шт):</label>
                <input type="number" id="gateCount" value="1" min="0" oninput="calculate()">
            </div>
        </div>

        <div class="section-title">3. Монтаж и доставка</div>
        <div class="checkbox-group">
            <input type="checkbox" id="montage" checked onchange="calculate()">
            <label for="montage">Включить монтаж строительной бригады</label>
        </div>
        <div class="form-group">
            <label for="distance">Расстояние доставки от г. Костанай (км):</label>
            <input type="number" id="distance" value="0" min="0" oninput="calculate()">
        </div>

        <div class="section-title">4. Фундамент</div>
        <div class="checkbox-group">
            <input type="checkbox" id="useFoundation" onchange="toggleFoundationInputs(); calculate();">
            <label for="useFoundation">Требуется расчет фундамента</label>
        </div>
        <div id="foundation-inputs" style="display: none; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label for="foundWidth">Ширина ленты (м):</label>
                <input type="number" id="foundWidth" value="0.4" step="0.1" min="0.1" oninput="calculate()">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="foundHeight">Высота ленты (м):</label>
                <input type="number" id="foundHeight" value="0.6" step="0.1" min="0.1" oninput="calculate()">
            </div>
        </div>

        <div class="result" id="total-price">Загрузка расчёта...</div>
    </div>

    <div id="error-box" class="error-screen" style="display: none;">
        <h2>Доступ ограничен</h2>
        <p id="error-text">Эта персональная ссылка уже была использована ранее или не существует.</p>
    </div>
</div>

<script>
    var BIN_ID = "6ac4cb26ffd5d16053522bbd";
    var SECRET_KEY = "$2a$10$IMgqPeq6EGMUWkoPpesa5.NXtCKi6SpV9oE.H/hRWRVC9gheuz1WO";
    var NDS_RATE = 1.16; // НДС 16%

    function toggleWallHeight() {
        var type = document.getElementById('type').value;
        var box = document.getElementById('wall-height-box');
        if (type === 'straight_tent') {
            box.style.display = 'block';
            document.getElementById('wallHeight').value = 3;
        } else if (type === 'straight_prof') {
            box.style.display = 'block';
            document.getElementById('wallHeight').value = 4;
        } else {
            box.style.display = 'none';
        }
    }

    function toggleFoundationInputs() {
        var checked = document.getElementById('useFoundation').checked;
        document.getElementById('foundation-inputs').style.display = checked ? 'flex' : 'none';
    }

    function calculate() {
        var type = document.getElementById('type').value;
        var width = parseFloat(document.getElementById('width').value) || 0;
        var length = parseFloat(document.getElementById('length').value) || 0;
        var wallHeight = parseFloat(document.getElementById('wallHeight').value) || 0;
        var area = width * length;

        var pricePerMeterBase = 0;
        var isTent = true;

        // 1. Расчет базовой цены за м² конструкции
        if (type === 'arch_tent') {
            isTent = true;
            if (width >= 10 && width <= 13) pricePerMeterBase = 17000;
            else if (width >= 14 && width <= 16) pricePerMeterBase = 19000;
            else if (width >= 17 && width <= 27) pricePerMeterBase = 22000;
            else pricePerMeterBase = 22000;
        } else if (type === 'straight_tent') {
            isTent = true;
            if (width >= 10 && width <= 13) pricePerMeterBase = 19000;
            else if (width >= 14 && width <= 30) pricePerMeterBase = 25000;
            else pricePerMeterBase = 25000;
        } else if (type === 'straight_prof') {
            isTent = false;
            if (width >= 10 && width <= 13) pricePerMeterBase = 23000;
            else if (width >= 14 && width <= 30) pricePerMeterBase = 26000;
            else pricePerMeterBase = 26000;
        }

        var constrCostNoNDS = area * pricePerMeterBase;

        // Наценка 3% за каждый метр высоты стены сверх нормы
        if (type === 'straight_tent' && wallHeight > 3) {
            constrCostNoNDS += constrCostNoNDS * ((wallHeight - 3) * 0.03);
        } else if (type === 'straight_prof' && wallHeight > 4) {
            constrCostNoNDS += constrCostNoNDS * ((wallHeight - 4) * 0.03);
        }

        // 2. Расчет ворот и их ширины для фундамента
        var gateVal = document.getElementById('gates').value;
        var gateCount = parseInt(document.getElementById('gateCount').value) || 0;
        
        var singleGatePriceWithNDS = 0;
        var gateWidth = 0;

        if (gateVal === '3x3') {
            singleGatePriceWithNDS = 600000;
            gateWidth = 3;
        } else if (gateVal === '4x4') {
            singleGatePriceWithNDS = 700000;
            gateWidth = 4;
        } else if (gateVal === '5x5') {
            singleGatePriceWithNDS = 800000;
            gateWidth = 5;
        }

        var gatesCostWithNDS = singleGatePriceWithNDS * gateCount;
        var totalGatesWidthDeduction = gateWidth * gateCount; // Длина фундамента, вычитаемая под ворота

        // 3. Расчет монтажа
        var montageCostNoNDS = 0;
        if (document.getElementById('montage').checked) {
            montageCostNoNDS = constrCostNoNDS * (isTent ? 0.18 : 0.23);
        }

        // 4. Расчет доставки
        var distance = parseFloat(document.getElementById('distance').value) || 0;
        var deliveryCostNoNDS = distance * 1000;

        // 5. Расчет фундамента (с учётом вычета под ворота)
        var foundationCostNoNDS = 0;
        var totalCubes = 0;
        if (document.getElementById('useFoundation').checked) {
            var fW = parseFloat(document.getElementById('foundWidth').value) || 0.4;
            var fH = parseFloat(document.getElementById('foundHeight').value) || 0.6;

            var fullPerimeter = 2 * (width + length);
            // Вычитаем длину ворот из периметра ленты
            var tapeLength = Math.max(0, fullPerimeter - totalGatesWidthDeduction);
            
            var tapeCubes = tapeLength * fW * fH;
            var blindAreaCubes = fullPerimeter * 1.0 * 0.1; // Отмостка считается по всему периметру

            var supportsCount = Math.floor(length / 3) * 2 + 8;
            var pilesCubes = supportsCount * 0.25;

            totalCubes = tapeCubes + blindAreaCubes + pilesCubes;
            foundationCostNoNDS = totalCubes * 135000;
        }

        // Применение НДС 16% ко всем статьям без НДС
        var totalNoNDS = constrCostNoNDS + montageCostNoNDS + deliveryCostNoNDS + foundationCostNoNDS;
        var totalFinal = (totalNoNDS * NDS_RATE) + gatesCostWithNDS;

        document.getElementById('total-price').innerHTML = 
            'Площадь ангара: <b>' + area + ' м²</b><br>' +
            (totalCubes > 0 ? 'Объём фундамента: <b>' + totalCubes.toFixed(2) + ' м³</b><br>' : '') +
            'Итоговая стоимость: <br><span style="font-size: 24px; color: #007bff;"><b>' + Math.round(totalFinal).toLocaleString('ru-RU') + ' ₸</b></span>';
    }

    function showError(msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('calculator').style.display = 'none';
        document.getElementById('error-box').style.display = 'block';
        if (msg) {
            document.getElementById('error-text').innerText = msg;
        }
    }

    function verifyAndBurnToken() {
        var urlParams = new URLSearchParams(window.location.search);
        var linkId = urlParams.get('id');
        var client = urlParams.get('client');

        if (!linkId) {
            showError("Отсутствует идентификатор ссылки.");
            return;
        }

        var xhrGet = new XMLHttpRequest();
        xhrGet.open("GET", "https://api.jsonbin.io/v3/b/" + BIN_ID + "/latest", true);
        xhrGet.setRequestHeader("X-Master-Key", SECRET_KEY);
        
        xhrGet.onload = function() {
            if (xhrGet.status !== 200) {
                showError("Ошибка доступа к базе данных (Код: " + xhrGet.status + ")");
                return;
            }

            try {
                var response = JSON.parse(xhrGet.responseText);
                var db = response.record || {};

                if (!db[linkId] || db[linkId].used === true) {
                    showError("Эта ссылка уже сгорела или не существует.");
                    return;
                }

                db[linkId].used = true;

                var xhrPut = new XMLHttpRequest();
                xhrPut.open("PUT", "https://api.jsonbin.io/v3/b/" + BIN_ID, true);
                xhrPut.setRequestHeader("Content-Type", "application/json");
                xhrPut.setRequestHeader("X-Master-Key", SECRET_KEY);

                xhrPut.onload = function() {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('calculator').style.display = 'block';
                    if (client) {
                        document.getElementById('welcome-client').innerText = "Расчёт для: " + decodeURIComponent(client);
                    }
                    calculate();
                };

                xhrPut.onerror = function() {
                    showError("Ошибка обновления статуса ссылки.");
                };

                xhrPut.send(JSON.stringify(db));

            } catch(e) {
                showError("Ошибка обработки данных.");
            }
        };

        xhrGet.onerror = function() {
            showError("Не удалось связаться с сервером.");
        };

        xhrGet.send();
    }

    verifyAndBurnToken();
</script>

</body>
</html>
