<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор ссылок</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; padding: 25px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #28a745; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #94d3a2; cursor: not-allowed; }
        .result-box { margin-top: 20px; padding: 15px; background: #eef7ee; border: 1px solid #c3e6cb; border-radius: 6px; display: none; }
        .copy-btn { background: #007bff; margin-top: 8px; }
        .status-msg { margin-top: 10px; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔗 Генератор 100% одноразовых ссылок</h2>
    <div class="form-group">
        <label for="clientName">Имя клиента / Компания:</label>
        <input type="text" id="clientName" placeholder="Введите имя...">
    </div>
    <button onclick="createLink()" id="genBtn">Сформировать ссылку</button>
    <div id="statusMsg" class="status-msg"></div>

    <div class="result-box" id="resultBox">
        <label for="generatedUrl">Готовая одноразовая ссылка:</label>
        <input type="text" id="generatedUrl" readonly>
        <button class="copy-btn" onclick="copyLink()" id="copyBtn">📋 Скопировать ссылку</button>
    </div>
</div>

<script>
    const BIN_ID = "6ac4cb26ffd5d16053522bbd";
    const SECRET_KEY = "$2a$10$IMgqPeq6EGMUWkoPpesa5.NXtCKi6SpV9oE.H/hRWRVC9gheuz1WO";
    const BASE_URL = "https://roptoomamyr-sudo.github.io/hangar-bot/";

    async function createLink() {
        const clientInput = document.getElementById('clientName');
        const client = clientInput ? clientInput.value.trim() : "";
        const status = document.getElementById('statusMsg');
        const btn = document.getElementById('genBtn');
        
        if (!client) { 
            alert('Введите имя клиента'); 
            return; 
        }

        btn.disabled = true;
        btn.innerText = "Создание ссылки...";
        status.style.color = "#007bff";
        status.innerText = "Подключение к базе данных...";

        const linkId = "id_" + Math.floor(Math.random() * 899999 + 100000);

        try {
            const res = await fetch("https://api.jsonbin.io/v3/b/" + BIN_ID + "/latest", {
                headers: { "X-Master-Key": SECRET_KEY }
            });

            if (!res.ok) {
                throw new Error("Ошибка базы данных (" + res.status + ")");
            }

            const data = await res.json();
            const currentDb = data.record || {};

            currentDb[linkId] = { client: client, used: false };

            const putRes = await fetch("https://api.jsonbin.io/v3/b/" + BIN_ID, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": SECRET_KEY
                },
                body: JSON.stringify(currentDb)
            });

            if (!putRes.ok) {
                throw new Error("Ошибка сохранения");
            }

            const finalUrl = BASE_URL + "?client=" + encodeURIComponent(client) + "&id=" + linkId;
            document.getElementById('generatedUrl').value = finalUrl;
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('copyBtn').innerText = '📋 Скопировать ссылку';
            status.innerText = "";

        } catch (err) {
            status.style.color = "#dc3545";
            status.innerText = "Ошибка: " + err.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "Сформировать ссылку";
        }
    }

    function copyLink() {
        const field = document.getElementById('generatedUrl');
        field.select();
        navigator.clipboard.writeText(field.value);
        document.getElementById('copyBtn').innerText = '✅ Скопировано!';
    }
</script>

</body>
</html>
