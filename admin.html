<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — Генератор ссылок</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 700px; width: 100%; padding: 25px; box-sizing: border-box; margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #007bff; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 15px; padding: 15px; background-color: #eef7ee; border: 1px solid #c3e6cb; border-radius: 6px; word-break: break-all; display: none; }
        .status { margin-top: 10px; font-weight: bold; text-align: center; }
        
        /* Таблица истории */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; color: #333; }
        .badge-pending { background: #fff3cd; color: #856404; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-used { background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .refresh-btn { background-color: #6c757d; margin-bottom: 10px; }
        .refresh-btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔑 Генератор одноразовых ссылок</h2>
    
    <div class="form-group">
        <label for="clientName">Имя клиента / Организация:</label>
        <input type="text" id="clientName" placeholder="Например: Иван (ТОО Агро)">
    </div>

    <button onclick="generateLink()">Сформировать ссылку</button>

    <div class="status" id="status-text"></div>

    <div class="result-box" id="result-box">
        <strong>Готовая ссылка для клиента:</strong><br>
        <p id="generated-url" style="color: #007bff; font-weight: bold; margin: 10px 0;"></p>
        <button onclick="copyUrl()" style="background-color: #28a745;">Скопировать ссылку</button>
    </div>
</div>

<div class="card">
    <h3>📊 История ссылок и статусы</h3>
    <button class="refresh-btn" onclick="loadHistory()">🔄 Обновить список клиентов</button>
    
    <div id="history-loading" style="text-align: center; color: #6c757d; display: none;">Загрузка списка...</div>

    <table id="history-table" style="display: none;">
        <thead>
            <tr>
                <th>Клиент</th>
                <th>Дата создания</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>
</div>

<script>
    const BIN_ID = "6ac4cb26ffd5d16053522bbd";
    const SECRET_KEY = "$2a$10$IMgqPeq6EGMUWkoPpesa5.NXtCKi6SpV9oE.H/hRWRVC9gheuz1WO";
    const BASE_URL = "https://roptoomamyr-sudo.github.io/hangar-bot/";

    function generateLink() {
        const clientInput = document.getElementById('clientName');
        const clientName = clientInput ? clientInput.value.trim() : "";
        if (!clientName) {
            alert("Пожалуйста, введите имя клиента!");
            return;
        }

        const statusText = document.getElementById('status-text');
        statusText.style.color = "#007bff";
        statusText.innerText = "Подключение к базе данных...";

        const xhrGet = new XMLHttpRequest();
        xhrGet.open("GET", https://api.jsonbin.io/v3/b/${BIN_ID}/latest, true);
        xhrGet.setRequestHeader("X-Master-Key", SECRET_KEY);

        xhrGet.onload = function() {
            if (xhrGet.status !== 200) {
                statusText.style.color = "red";
                statusText.innerText = "Ошибка получения базы данных (Код: " + xhrGet.status + ")";
                return;
            }

            try {
                const response = JSON.parse(xhrGet.responseText);
                let db = response.record || {};

                const linkId = "id_" + Date.now();
                const now = new Date();
                const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});

                db[linkId] = {
                    client: clientName,
                    used: false,
                    created_at: dateStr
                };

                const xhrPut = new XMLHttpRequest();
                xhrPut.open("PUT", https://api.jsonbin.io/v3/b/${BIN_ID}, true);
                xhrPut.setRequestHeader("Content-Type", "application/json");
                xhrPut.setRequestHeader("X-Master-Key", SECRET_KEY);

                xhrPut.onload = function() {
                    if (xhrPut.status === 200) {
                        statusText.innerText = "";
                        const fullUrl = ${BASE_URL}?client=${encodeURIComponent(clientName)}&id=${linkId};
                        document.getElementById('generated-url').innerText = fullUrl;
                        document.getElementById('result-box').style.display = 'block';
                        document.getElementById('clientName').value = '';
                        loadHistory();
                    } else {
                        statusText.style.color = "red";
                        statusText.innerText = "Ошибка записи ссылки.";
                    }
                };

                xhrPut.send(JSON.stringify(db));

            } catch(e) {
                console.error(e);
                statusText.style.color = "red";
                statusText.innerText = "Ошибка обработки данных.";
            }
        };

        xhrGet.onerror = function() {
            statusText.style.color = "red";
            statusText.innerText = "Ошибка сети при обращении к серверу.";
        };

        xhrGet.send();
    }

    function copyUrl() {
        const urlText = document.getElementById('generated-url').innerText;
        navigator.clipboard.writeText(urlText).then(() => {
            alert("Ссылка скопирована в буфер обмена!");
        });
    }

    function loadHistory() {
        const loading = document.getElementById('history-loading');
        const table = document.getElementById('history-table');
        const tbody = document.getElementById('history-body');

        if (loading) loading.style.display = 'block';
        if (table) table.style.display = 'none';
        if (tbody) tbody.innerHTML = '';

        const xhr = new XMLHttpRequest();
        xhr.open("GET", https://api.jsonbin.io/v3/b/${BIN_ID}/latest, true);
        xhr.setRequestHeader("X-Master-Key", SECRET_KEY);

        xhr.onload = function() {
            if (loading) loading.style.display = 'none';
            if (xhr.status === 200) {
                try {
                    const response = JSON.parse(xhr.responseText);
                    const db = response.record || {};
                    
                    const keys = Object.keys(db).reverse();
                    if (keys.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Ссылки ещё не создавались</td></tr>';
                    } else {
                        keys.forEach(key => {
                            const item = db[key];
                            if (item && typeof item === 'object') {
                                const clientName = item.client || (typeof item === 'string' ? item : 'Без имени');
                                const isUsed = item.used === true;
                                const createdAt = item.created_at || '—';

                                const tr = document.createElement('tr');
                                const statusBadge = isUsed 
                                    ? '<span class="badge-used">🔴 Сгорела (Открыта)</span>' 
                                    : '<span class="badge-pending">🟡 Ожидает открытия</span>';

                                tr.innerHTML = `
                                    <td><b>${clientName}</b></td>
                                    <td>${createdAt}</td>
                                    <td>${statusBadge}</td>
                                `;
                                tbody.appendChild(tr);
                            }
                        });
                    }
                    if (table) table.style.display = 'table';
                } catch(e) {
                    console.error("Ошибка при разборе истории:", e);
                }
            }
        };

        xhr.send();
    }

    // Автоматическая загрузка истории при открытии
    window.onload = function() {
        loadHistory();
    };
</script>

</body>
</html>
