<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — Генератор ссылок</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; padding: 25px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #007bff; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .result-box { margin-top: 15px; padding: 15px; background-color: #eef7ee; border: 1px solid #c3e6cb; border-radius: 6px; word-break: break-all; display: none; }
        .status { margin-top: 10px; font-weight: bold; text-align: center; color: #007bff; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔑 Генератор одноразовых ссылок</h2>
    
    <div class="form-group">
        <label for="clientName">Имя клиента / Организация:</label>
        <input type="text" id="clientName" placeholder="Например: Иван (ТОО Агро)">
    </div>

    <button id="mainBtn" type="button">Сформировать ссылку</button>

    <div class="status" id="status-text"></div>

    <div class="result-box" id="result-box">
        <strong>Готовая ссылка для клиента:</strong><br>
        <p id="generated-url" style="color: #007bff; font-weight: bold; margin: 10px 0;"></p>
        <button id="copyBtn" type="button" style="background-color: #28a745;">Скопировать ссылку</button>
    </div>
</div>

<script>
    const BIN_ID = "6ac4cb26ffd5d16053522bbd";
    const SECRET_KEY = "$2a$10$9Exa4U6mhnBLUonlmGU9k.F34LVjzJAC.TOInxH6vJHAt6JF1HBry";
    const BASE_URL = "https://roptoomamyr-sudo.github.io/hangar-bot/";

    document.getElementById('mainBtn').addEventListener('click', function() {
        const clientInput = document.getElementById('clientName');
        const clientName = clientInput.value.trim();

        if (!clientName) {
            alert("Пожалуйста, введите имя клиента!");
            return;
        }

        const btn = document.getElementById('mainBtn');
        const statusText = document.getElementById('status-text');
        const resultBox = document.getElementById('result-box');

        btn.disabled = true;
        statusText.style.color = "#007bff";
        statusText.innerText = "Подключение к базе данных...";
        resultBox.style.display = "none";

        // Запрос на получение данных
        fetch("https://api.jsonbin.io/v3/b/" + BIN_ID + "/latest", {
            method: "GET",
            headers: {
                "X-Master-Key": SECRET_KEY
            }
        })
        .then(function(res) {
            if (!res.ok) throw new Error("Ошибка чтения базы: " + res.status);
            return res.json();
        })
        .then(function(data) {
            let db = data.record;
            if (!db || typeof db !== 'object' || Array.isArray(db)) {
                db = {};
            }

            const linkId = "id_" + Date.now();
            db[linkId] = {
                client: clientName,
                used: false
            };

            // Запрос на запись
            return fetch("https://api.jsonbin.io/v3/b/" + BIN_ID, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": SECRET_KEY
                },
                body: JSON.stringify(db)
            })
            .then(function(resPut) {
                if (!resPut.ok) throw new Error("Ошибка сохранения: " + resPut.status);
                return linkId;
            });
        })
        .then(function(linkId) {
            btn.disabled = false;
            statusText.innerText = "";
            const fullUrl = BASE_URL + "?client=" + encodeURIComponent(clientName) + "&id=" + linkId;
            document.getElementById('generated-url').innerText = fullUrl;
            resultBox.style.display = "block";
            clientInput.value = "";
        })
        .catch(function(err) {
            btn.disabled = false;
            statusText.style.color = "red";
            statusText.innerText = err.message;
        });
    });

    document.getElementById('copyBtn').addEventListener('click', function() {
        const urlText = document.getElementById('generated-url').innerText;
        navigator.clipboard.writeText(urlText).then(function() {
            alert("Ссылка скопирована в буфер обмена!");
        });
    });
</script>

</body>
</html>
